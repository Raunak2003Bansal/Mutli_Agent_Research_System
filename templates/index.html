<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Agent</title>
    <!-- Link External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <h2>🔍 Research Agent</h2>
    <p>
        Enter a research topic:
        <input type="text" id="topic" name="topic" placeholder="e.g. recent AI advances">
        <button onclick="runResearch()">SUBMIT</button>
    </p>

    <div id="loading">⏳ Researching... this may take 30-60 seconds.</div>
    <div id="error"></div>
    <div id="output"></div>

    <!-- Link External JS -->
    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>
</html>
